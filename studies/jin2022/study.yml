  "source_notes": "Look at Supplementary Data 8 for counts, and scale. Note that each sample has three technical replicates to check reproducibility. \n\nGroup(condition) can be identified by sample name. How to interpret sample name;\n- First two letter indicates group; 1) three 6-week old mice (CEa, CEb, CEc); maintained by balanced diet for full life span, 2) four 8-week-old (VSa, VSb, VSc, VSd), 3) four mice (VDa, VDb, Vdc, VDd). \n- Super script 'dist' and 'prox' indicates location of cecum it was collected (distal and proximal, Fig 1b). \n- Number indicates technical replicates (i.e., CEa^dist1, CEa^dist2, CEa^dist3 are the three technical replicates from the same mice collected at same cecum location). \n\nCheck Supplementary Table 5 in 'Supplementary Information file' for more detailed description of names.\n\n\n\nFile Name: Supplementary Data 1\nDescription: BarBIQ-identified sequences (Bar sequences).\n\nFile Name: Supplementary Data 2\nDescription: Sanger sequencing-identified 16S rRNA sequences (San sequences).\n\nFile Name: Supplementary Data 3 \nDescription: Sequences of amplicon sequence variants (ASVs).                                                   \n\nFile Name: Supplementary Data 4 \nDescription: Representative sequences of operational taxonomic units (OTU-RepSeqs).\n\nFile Name: Supplementary Data 5 \nDescription: Sequencing-determined abundances of amplicon sequence variants (ASVs).\n\nFile Name: Supplementary Data 6 \nDescription: cOTU abundances of the mock community and the control M0.\n\nFile Name: Supplementary Data 7 \nDescription: Sequencing-determined abundances of operational taxonomic units (OTUs).\n\nFile Name: Supplementary Data 8 \nDescription: cOTU abundances of cecal samples.\nOTU and taxonomy ; Sheet \"Sequencing-determined counts\"\nScale ; Sheet \"Absolute total abundance\"\nAbsolute abundance ; Sheet \"Absolute abundance\"\n\nFile Name: Source Data\nDescription: Source data for figures in main text and Supplementary Information.\n",
  "preprocessing_notes": "Processing scripts are for preparing study data and may require additional bioinformatics software. Loading prepared data with mutt() does not run them.",
  "raw_availability": "No public sequencing accession is recorded for this study. Archived inputs are listed separately.",
