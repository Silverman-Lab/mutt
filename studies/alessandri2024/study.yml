  "source_notes": "paper: https://pmc.ncbi.nlm.nih.gov/articles/PMC11450379/#sec25\n\n\n10 subjects: faecal and vaginal samples were collected from 10 healthy women who had not taken prebiotics, probiotics or drugs during the 3\u2009months prior to sample collection.Faecal samples were inoculated in a human gut environment\u2010simulating growth medium, based on a previously described composition (Fehlbaum et al., 2015; Macfarlane et al., 1998).The same protocol was used for the cultivation of vaginal samples. However, in this case, a culture medium mimicking the human vaginal environment, that is, the simulated vaginal fluid, with a pH adjusted to 4.5, as previously described (Pan et al., 2019), was employed. Faecal and vaginal samples were cultivated for 19 and 24\u2009h, respectively, under anaerobic conditions at 37\u00b0C. Furthermore, for each of the two matrices, samples were cultured in the presence and absence of 2% \u03b1\u2010LA.\n\n(ClinicalTrials.gov identifier NCT05674318)\n\nTen patients with clinical signs of PCOS were enrolled for the in vivo pilot study at Agunco Obstetric and Gynecologic Centre (Rome, Italy). evaluate the possible impact of orally administrated \u03b1\u2010LA on vaginal microbiota in such patients, all the women underwent a 30\u2010day oral administration of \u03b1\u2010LA (300\u2009mg/twice a day), and two vaginal swabs were collected from each patient: one before (baseline\u2014T0) and one after (T1) \u03b1\u2010LA administration.\n\nCount tables/relative abundances/ASV-sequences processed by Maxwell Konnaris 04/09/25. Count tables and taxa sequences not provided by the study.\n\nRelative Abundances are provided by the study, but Maxwell reprocessed. Theirs is in Table S9\n\nall data collected by Maxwell Konnaris\n\nparse.R finished 04/09/25\n\n\n\n",
  "preprocessing_notes": "Processing scripts are for preparing study data and may require additional bioinformatics software. Loading prepared data with mutt() does not run them.",
