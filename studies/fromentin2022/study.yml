  "source_notes": "Paper: https://www.nature.com/articles/s41591-022-01688-4\n\nThis study encompassed 372 individuals with IHD, including 112 with acute coronary syndrome (ACS), 158 with chronic ischemic heart disease (CIHD) and 102 with IHD and heart failure (HF). Included 275 healthy controls (HCs) matched on demographics, age and sex and 222 untreated metabolically matched controls (UMMCs)\u2014that is, individuals with features of the metabolic syndrome and at increased risk of IHD but receiving no lipid-lowering or anti-diabetic or anti-hypertensive drugs. Included 372 controls matched with individuals with IHD in terms of T2D status and body mass index (BMI), thereafter termed metabolically matched controls (MMCs). They profiled their serum and urine metabolome (1,558 metabolites and lipids) and examined their intestinal microbiome, considering inter-individual variations in absolute fecal bacterial cell density, a factor potentially reflecting the disease state and obscuring genuine microbiome involvement.\n\nCode: https://github.com/TillBirkner/metadeconfoundR\n\nI think data can be downloaded straight from repo R folder or from package: install.packages(\"metadeconfoundR\") in R \n",
