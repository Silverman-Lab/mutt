  "source_notes": "Data from paper: https://pmc.ncbi.nlm.nih.gov/articles/PMC7244552/\n\nMicrobial Load = dPCR\u00a0concentration \u00d7 elution\u00a0volume \u00d7 dead\u00a0volume\u00a0factor \u00f7 (extraction\u00a0volume \u00d7 sample\u00a0mass )\nDead\u00a0volume\u00a0factor = volume\u00a0recovered / total\u00a0volume\u00a0applied\n\u200b\nEvery sample that underwent dPCR had total microbial load measured. According to the experimental setup described\u200b:\nStool samples were collected before the diet switch (Day 0), and after the switch at Day 4, Day 7, and Day 10.\nGI tract samples (Stomach, Upper Small Intestine, Lower Small Intestine, Cecum, Colon, Mucosa) were collected on Day 10.\nEach mouse had microbial load measured in stool and GI sites.\nThey had 12 mice total (6 ketogenic diet, 6 control diet).\nTherefore, microbial load was measured in:\nAll stool samples (4 timepoints \u00d7 12 mice = 48 stool samples)\nMultiple GI sites at necropsy (Day 10 samples), for mucosal and lumenal samples.\n\nExperimental setup:\n12 mice total (6 ketogenic diet, 6 control diet)\n\nTimepoints:\n\nDay 0 \u2014 stool only (before diet switch)\nDay 4 \u2014 stool only\nDay 7 \u2014 stool only\nDay 10 \u2014 stool and GI tract (euthanized on Day 10)\n\nSample Types:\nStool (Day 0, 4, 7, 10)\n\nGI sites collected at necropsy (Day 10 only):\nStomach contents (lumen)\nUpper small intestine contents (lumen)\nUpper small intestine mucosa (scraping)\nLower small intestine contents (lumen)\nLower small intestine mucosa (scraping)\nCecum contents (lumen)\nColon mucosa (scraping)\n\nNote: Colon mucosa only (they didn't collect colon lumen separately), and stool counts as terminal colon contents.\n\nStool samples:\n4 timepoints \u00d7 12 mice = 48 stool samples\n\nGI tract samples at Day 10:\nEach mouse provides:\n\nStomach lumen\nUpper SI lumen\nUpper SI mucosa\nLower SI lumen\nLower SI mucosa\nCecum lumen\nColon mucosa\n\n\u2192 7 GI site samples per mouse\n\nThus:\n7 \u00d7 12 = 84 GI samples from euthanized mice\n\nTotal samples:\n48 (stool) + 84\u00a0(GI\u00a0Day\u00a010) = 132\u00a0samples\u00a0total\n\nEach sample would have a unique name, generally like:\nM1P_D0_Stool\nM1P_D10_Stomach_Lumen\nM1P_D10_UpperSI_Lumen\nM1P_D10_UpperSI_Mucosa\nM1P_D10_LowerSI_Lumen\nM1P_D10_LowerSI_Mucosa\nM1P_D10_Cecum_Lumen\nM1P_D10_Colon_Mucosa\netc.\n\nwhere:\n\nM1P = Mouse 1, control diet\nM1NP = Mouse 1, ketogenic diet\n\n(P vs NP probably meaning something like Positive/Negative for Keto in their naming.)\n\nSo to summarize:\n\nItem\tCount\nStool (Day 0, 4, 7, 10)\t48 samples\nGI Tract (Stomach, SI, Cecum, Colon, Mucosa, Day 10)\t84 samples\nTotal samples\t132 samples\n",
