  "source_notes": "Clinical trial, Maxwell communicated with authors and they uploaded the data publicly as it has been 8 years since trial ended. They also sent the scale. Maxwell wrote a cleanSRA python script that cleans the scraped .xml file and puts it into metadata.csv format. All genomic material processed by Maxwell 04/10/25 and parse.R completed 04/10/25. Bioproject: PRJNA1233249\n\nAuthors did not provide count or relative abundances. \n\nThis is a population of uncircumcised men who became infected by HIV during a 2-year clinical trial had higher levels of penile anaerobes than uncircumcised men who remained HIV negative. They found that having higher levels of penile anaerobes was also associated with higher production of immune factors that recruit HIV target cells to the foreskin, suggesting that anaerobes may modify HIV risk by triggering inflammation. These anaerobes are known to be shared by heterosexual partners and are associated with HIV risk in women. Therefore, penile anaerobes may be a sexually transmissible risk factor for HIV, and modifying the penile microbiome could potentially reduce HIV acquisition in both men and women.\n\n182 human subjects (men) with 1 coronal sculcus swab sample each.\n\nPaper: https://pmc.ncbi.nlm.nih.gov/articles/PMC5527312/\n",
