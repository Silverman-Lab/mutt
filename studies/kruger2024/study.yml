  "source_notes": "paper: https://pmc.ncbi.nlm.nih.gov/articles/PMC11490648/\n\nKruger ended up getting back to us as the corresponding author has left their department and does not assume the contact responsibility for their study anymore. Kruger is on sick leave and still completed our request on 5/28/25 and went the extra mile to supply us with dnaconcentrations for each sample measured in ng/ul.\n\nParticipants collected faecal samples on three consecutive days, or alternatively at three timepoints as close as possible to each other within one week. \nAll faecal sample analyses from the same individual for all measurements were performed within the same batch. 10 replicates of 1\u20132 gram faeces were made from a pooled sample of 15 gram faeces obtained from all ten participants. Afterwards, five replicates were then processed by hammering only, while five replicates were both hammered and mill-homogenised. water content and ph were measured, protein biomarkers through ELISA, and SCFA/BCFAs were measured via GC-MS, also performed untargeted metabolomics through LC-MS, and UHPLC-Q-Orbitrap-MS/MS.\n\n\nSix quality controls (QC), which consisted of a pool of the faecal samples from the participants, were analysed to ensure precision and stability of the LC-MS machine during the whole process of injection. QC samples were injected every after 10 sample injections and was used to assess chromatographic drift and instrumental errors.\n\ndnaconcetrations.csv = \nSample description\t\n1\tMill homogenised samples were extracted in duplicate using the PowerSoil DNA kit from Qiagen\n\t(only the first extracted sample of the duplicates was used for sequencing)\n2\tDNA concentrations were measured with 2ul on the Nanodrop\n3\tEach individual (subject number eg 19) had samples taken on three timepoints -three consecutive days (.1, .2, .3)\n4\tFor all samples on day 1 (.1) , there were additional extractions done with a different sample preparation ( IKA- samples=hammered only)\n\n",
  "preprocessing_notes": "Processing scripts are for preparing study data and may require additional bioinformatics software. Loading prepared data with mutt() does not run them.",
