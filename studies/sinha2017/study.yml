  "source_notes": "MBQC project - it aims to evaluate methods for measuring human microbiome (protocols for handling human microbiome samples and computational pipelines for microbial data processing). The goal is helping context-dependent protocol choices by identifying the relative effect sizes of individual variables.\n\nThe data include results sequenced by 15 laboratories and analyzed based on 9 bioinformatics protocols. \n\n------\n\nSupplementary Datasets can be found in the paper ; https://www.nature.com/articles/nbt.3981#Sec26\n\n\nSupplementary Data set 1\nExtended literature review and categorization of microbiome protocol studies. (XLSX 117 kb)\n\nSupplementary Data set 2\nHandling protocol variables recorded during the MBQC-base. (XLSX 25 kb)\n\nSupplementary Data set 3\nBioinformatics protocol variable reporting. (XLSX 24 kb)\n\nSupplementary Data set 4\nHandling protocol variables curated from the MBQC-base. (XLSX 16 kb)\n\nSupplementary Data set 5\nRaw read counts per sample. (XLSX 41 kb)\nNote ; 'Blinded sample ID' matches with row names in Supplementary Dataset 6.\n\nSupplementary Data set 6\nMBQC-base OTU table. (ZIP 14543 kb)\nNote ; It has both metadata and OTU counts. \nNote ; Check if this identical to mbqc_integrated_otus.tsv retrieved from mbqc_org_files\nNote ; nt_count seems to be the scale.\n\nSupplementary Data set 7\nAlpha and beta diversities stratified by sample type within and between 175 handling and bioinformatics laboratories. (ZIP 7139 kb)\n\nSupplementary Data set 8\nBeta-diversity divergence from artificial community positive controls; 181 stratified by handling and bioinformatics laboratories. (TXT 2 kb)\n\n\n------\n\nmbqc_org_files are retrieved from https://www.hmpdacc.org/MBQC/\nSeems like they provide the same information as supplementary datasets, but will need to check\n\n",
