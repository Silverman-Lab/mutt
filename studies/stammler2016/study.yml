  "source_notes": "\nAdditional file 1: Table S1:\nSpecies-specific and total 16S rDNA quantitative realtime-PCR measurements. (XLSX 13 kb)\nHas total 16s rDNA copies per sample (sample65 ~ sample102 : mice)\n\nAdditional file 2: Table S2:\nDesign of dilution experiment. (XLSX 16 kb)\nHas information about amount of spiked 16S rRNA copies per sample\n\nAdditional file 3: Table S3:\nPools of bacterial mock communities containing S. ruber, A. acidiphilus and R. radiobacter. (XLSX 13 kb)\nHas information about the amount of three bacteria spiked into each pool. \n\nAdditional file 4: Table S4:\nPrimers and hydrolysis probes used in this study. (XLSX 13 kb)\n\nAdditional file 5:\n16S rDNA reference sequences of S. ruber, A. acidiphilus and R. radiobacter. (FASTA 4 kb)\n\nAdditional file 6:\nR-Script for reproduction of analysis and figures of this study. (R 39 kb)\n\nAdditional file 7:\nDilution experiment mapping file as used for reproduction. (TXT 3 kb)\nNote : sample ID is MID01 - MID40. Check Additional file 11 to check mapping to sample(65-102)\n\nAdditional file 8:\nASCT experiment mapping file as used for reproduction. (TXT 1 kb)\nSampleID : MID26-43, but don't confuse this with samples from Additional file 7. Additional file 8 is human data (ASCT experiment) and Additional file 7 is mice data (dilution experiment).\n\nAdditional file 9:\nDilution experiment OTU table as used for reproduction. (TXT 460 kb)\n\nAdditional file 10:\nASCT experiment OTU table as used for reproduction. (TXT 621 kb)\n\nAdditional file 11:\nTotal 16S rDNA qRT-PCR measurements as used for reproduction. (CSV 1 kb)\nNote : this data matches with total 16S rDNA copies from Additional file 1. Also gives mapping to Sample (65-102) and SampleID (MID1-MID40) used in dilution experiment. Sample 87 and 88 are missing from this mapping. \n\nAdditional file 12:\nSpike-in concentrations by design as used for reproduction. (CSV 1 kb)\n\n\n\n\n",
