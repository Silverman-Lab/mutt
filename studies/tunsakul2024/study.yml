  "source_notes": "paper: \ncode:\n\n9 healthy and 11 fat-metabolic disorder Thai adults aged 23\u201343 years with qPCR total microbial load measurements. The 40 fecal samples were split into anaerobic and aerobic sample processing and evaluated (2 samples from each patient, 1 goes to aerobic collection and the other goes to anaerobic collection).  \"employed metagenomics followed by 16S rRNA gene sequencing and 16S rRNA gene qPCR, to analyze taxonomic composition, alpha diversity, beta diversity, bacterial quantification, Pearson's correlation with clinical factors for fat-metabolic disorder, and the microbial community and species potential metabolic functions\"\n",
