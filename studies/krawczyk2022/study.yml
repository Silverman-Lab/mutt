  "source_notes": "paper: https://pmc.ncbi.nlm.nih.gov/articles/PMC9351266/\n\nmale and female tick samples, three negative controls were sequenced: two that went through the same processes as tick samples including crushing, extraction, and amplification and one included by the sequencing company. pooled samples.\n\nA wide range of bacterial loads was found. Accurate quantification of low microbial biomass samples permitted comparisons to high biomass samples, despite the presence of contaminating DNA. The bacterial communities of ticks were associated with geographical location rather than life stage, and differences in Rickettsia abundance determined this association.\n\nexplored the geographical distribution of four vertically transmitted symbionts identified in the microbiome analysis. screened 16,555 nymphs from 19 forest sites for R. helvetica, Rickettsiella spp., Midichloria mitochondrii, and Spiroplasma ixodetis.\n",
